<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | DOZO Teacher</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="shortcut icon" href="/static/assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .change-password-card {
            max-width: 500px;
            margin: 40px auto;
        }

        .password-strength {
            height: 4px;
            width: 100%;
            background: #eee;
            margin-top: 8px;
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="/static/assets/logo.png" alt="DOZO Logo">
        </div>
        <div class="nav-center">
            <h2>Change Password</h2>
        </div>
        <div class="nav-right">
            <div class="user-profile">
                <span style="font-size: 0.9rem; font-weight: 600;">Teacher</span>
                <i class="fa fa-user-circle" style="font-size: 1.5rem; color: var(--primary-color);"></i>
            </div>
        </div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">Manage</div>
            <a href="/teacher/dashboard" class="menu-item">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="/teacher/attendance" class="menu-item">
                <i class="fas fa-calendar-check"></i> My Attendance
            </a>
            <a href="/teacher/leaves" class="menu-item">
                <i class="fas fa-envelope-open-text"></i> My Leaves
            </a>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">MAIN MENU</h3>
            <a href="/teacher/students" class="menu-item"><i class="fa fa-users"></i> My Students</a>
            <a href="/teacher/batches" class="menu-item"><i class="fa fa-layer-group"></i> My Batches</a>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">TOOLS</h3>
            <a href="/teacher/announcements" class="menu-item"><i class="fa fa-bullhorn"></i> Announcements</a>
            <a href="/teacher/tasks" class="menu-item"><i class="fa fa-tasks"></i> Manage Tasks</a>
            <a href="/teacher/task-review" class="menu-item"><i class="fa fa-check-double"></i> Task Review</a>
            <a href="/teacher/leaves" class="menu-item"><i class="fa fa-envelope"></i> My Leaves</a>
            <a href="/teacher/student-leaves" class="menu-item"><i class="fa fa-envelope-open-text"></i> Student
                Leaves</a>
            <a href="/teacher/todo" class="menu-item"><i class="fa fa-list-ul"></i> My Todo</a>
            <a href="/teacher/change-password" class="menu-item active"><i class="fa fa-key"></i> Change Password</a>
        </div>
        <div class="sidebar-footer">
            <a href="#" onclick="logout(); return false;" class="menu-item logout"><i class="fas fa-sign-out-alt"></i>
                Logout</a>
        </div>
    </aside>

    <div class="main-wrapper">
        <div class="change-password-card card">
            <div style="text-align: center; margin-bottom: 30px;">
                <div
                    style="width: 60px; height: 60px; background: #e0e7ff; color: #4f46e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 1.5rem;">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h2>Teacher Security</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Update your teacher account password.</p>
            </div>

            <form id="changePasswordForm">
                <div class="form-group">
                    <label class="form-label">Current Password</label>
                    <div style="position: relative;">
                        <input type="password" id="oldPassword" class="form-control"
                            placeholder="Enter current password" required>
                        <i class="far fa-eye toggle-password"
                            style="position: absolute; right: 15px; top: 12px; cursor: pointer; color: #999;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <div style="position: relative;">
                        <input type="password" id="newPassword" class="form-control" placeholder="Enter new password"
                            required>
                        <i class="far fa-eye toggle-password"
                            style="position: absolute; right: 15px; top: 12px; cursor: pointer; color: #999;"></i>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <div style="position: relative;">
                        <input type="password" id="confirmPassword" class="form-control"
                            placeholder="Confirm new password" required>
                        <i class="far fa-eye toggle-password"
                            style="position: absolute; right: 15px; top: 12px; cursor: pointer; color: #999;"></i>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 30px;">
                    <button type="button" class="btn btn-outline" style="flex: 1; justify-content: center;"
                        onclick="window.history.back()">Cancel</button>
                    <button type="submit" class="btn btn-gradient"
                        style="flex: 1; justify-content: center; background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);">Update
                        Password</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/teacher_change_password.js"></script>
</body>

</html>
