<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Leave Approval | DOZO</title>
    <link rel="shortcut icon" href="/static/assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .leave-table-container {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: 600;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-PENDING {
            background: #fff3cd;
            color: #856404;
        }

        .status-PENDING_ADMIN {
            background: #e0e7ff;
            color: #4338ca;
        }

        .status-APPROVED {
            background: #d4edda;
            color: #155724;
        }

        .status-REJECTED {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-approve {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-reject {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-approve:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        .btn-reject:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="/static/assets/logo.png" alt="DOZO Logo">
        </div>
        <div class="nav-center">
            <h2>Student Leave Approvals</h2>
        </div>
        <div class="nav-right">
            <div class="user-profile">
                <span id="teacherName" style="font-size: 0.9rem; font-weight: 600;">Teacher</span>
                <i class="fa fa-user-circle" style="font-size: 1.5rem; color: var(--primary-color);"></i>
            </div>
        </div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-section">
            <h3 class="sidebar-title">Manage</h3>
            <a href="/teacher" class="menu-item"><i class="fa fa-chart-line"></i> Dashboard</a>
            <a href="/teacher/attendance" class="menu-item"><i class="fa fa-calendar-check"></i> My Attendance</a>
            <a href="/teacher/leaves" class="menu-item"><i class="fa fa-envelope"></i> My Leaves</a>
            <a href="/teacher/change-password" class="menu-item"><i class="fa fa-key"></i> Change Password</a>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">Student Management</h3>
            <a href="/teacher/students" class="menu-item"><i class="fa fa-users"></i> My Students</a>
            <a href="/teacher/batches" class="menu-item"><i class="fa fa-layer-group"></i> My Batches</a>
            <a href="/teacher/student-leaves" class="menu-item active"><i class="fa fa-envelope-open-text"></i> Student
                Leaves</a>
        </div>
    </aside>

    <div class="main-wrapper">
        <div class="content-header">
            <div>
                <h1>Student Leave Requests</h1>
                <p>Approve or Reject leave applications from your students</p>
            </div>
        </div>

        <div class="leave-table-container">
            <table id="leaveTable">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Batch</th>
                        <th>Date</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leaveList">
                    <!-- Injected by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/teacher_student_leaves.js"></script>
</body>

</html>
