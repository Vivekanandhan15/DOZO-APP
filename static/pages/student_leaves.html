<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Requests | DOZO</title>
    <link rel="shortcut icon" href="/static/assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/student_page.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="/static/assets/logo.png" alt="DOZO Logo">
        </div>
        <div class="nav-center">
            <h2>Leave Requests</h2>
        </div>
        <div class="nav-right">
            <div class="user-profile">
                <span id="student-name-nav" style="font-size: 0.9rem; font-weight: 600;">Student</span>
                <i class="fa fa-user-circle" style="font-size: 1.5rem; color: var(--primary-color);"></i>
            </div>
        </div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-section">
            <h3 class="sidebar-title">MAIN MENU</h3>
            <a href="/student" class="menu-item"><i class="fa fa-chart-line"></i> Dashboard</a>
            <a href="/student/tasks" class="menu-item"><i class="fa fa-tasks"></i> My Tasks</a>
            <a href="/student/attendance" class="menu-item"><i class="fa fa-calendar-check"></i> My Attendance</a>
            <a href="/student/leaves" class="menu-item active"><i class="fa fa-envelope-open-text"></i> Leave
                Requests</a>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">SYSTEM</h3>
            <a href="/student/announcements" class="menu-item"><i class="fa fa-bullhorn"></i> Announcements</a>
            <a href="/student/profile" class="menu-item"><i class="fa fa-user"></i> My Profile</a>
        </div>
        <div class="sidebar-footer">
            <a href="#" onclick="logout(); return false;" class="menu-item logout"><i class="fas fa-sign-out-alt"></i>
                Logout</a>
        </div>
    </aside>

    <div class="main-wrapper">
        <section class="leave-section" style="padding: 20px;">
            <div class="content-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <!-- Apply Leave Form -->
                <div class="card" style="background: white; padding: 20px; border-radius: 12px; height: fit-content;">
                    <h3>Request Leave</h3>
                    <form id="leaveRequestForm">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label for="leaveDate">Date</label>
                            <input type="date" id="leaveDate" required
                                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                        </div>
                        <div class="form-group" style="margin-bottom: 20px;">
                            <label for="leaveReason">Reason</label>
                            <textarea id="leaveReason" rows="4" placeholder="Enter reason for leave..." required
                                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;"></textarea>
                        </div>
                        <button type="submit" class="btn-submit"
                            style="width: 100%; background: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600;">Submit
                            Leave Request</button>
                    </form>
                </div>

                <!-- History -->
                <div class="card" style="background: white; padding: 20px; border-radius: 12px;">
                    <h3>My Leave History</h3>
                    <div id="leaveList" class="leave-items">
                        <p style="color: #888; text-align: center; padding: 20px;">No leave requests found.</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/student_leaves.js"></script>
</body>

</html>
