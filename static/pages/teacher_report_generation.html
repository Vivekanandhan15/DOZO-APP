<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Reports | DOZO</title>
    <link rel="shortcut icon" href="/static/assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .report-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }

        .report-form-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .subjects-section {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .subjects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .form-input {
            width: 100%;
            padding: 10px 15px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-lite {
            background: #e5e7eb;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-lite:hover {
            background: #d1d5db;
        }

        .loading-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="/static/assets/logo.png" alt="DOZO Logo">
        </div>
        <div class="nav-center">
            <h2>Academic Reports</h2>
        </div>
        <div class="nav-right">
            <div class="user-profile">
                <span id="userName" style="font-size: 0.9rem; font-weight: 600;">Teacher</span>
                <i class="fa fa-user-circle" style="font-size: 1.5rem; color: var(--primary-color);"></i>
            </div>
        </div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-section">
            <h3 class="sidebar-title">Manage</h3>
            <a href="/teacher" class="menu-item"><i class="fa fa-chart-line"></i> Dashboard</a>
            <a href="/teacher/attendance" class="menu-item"><i class="fa fa-calendar-check"></i> My Attendance</a>
            <a href="/teacher/leaves" class="menu-item"><i class="fa fa-envelope"></i> My Leaves</a>
            <a href="/teacher/change-password" class="menu-item"><i class="fa fa-key"></i> Change Password</a>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">Student Management</h3>
            <a href="/teacher/students" class="menu-item"><i class="fa fa-users"></i> My Students</a>
            <a href="/teacher/batches" class="menu-item"><i class="fa fa-layer-group"></i> My Batches</a>
            <a href="/teacher/student-leaves" class="menu-item"><i class="fa fa-envelope-open-text"></i> Student
                Leaves</a>
            <a href="/teacher/reports" class="menu-item active"><i class="fa fa-file-pdf"></i> Reports</a>
        </div>
    </aside>

    
    <div class="main-wrapper">
        <div class="report-header">
            <h1>Academic Report Generation</h1>
            <p style="color: #666;">Generate professional performance reports with real-time data integration.</p>
        </div>

        <div class="report-form-container">
            <form id="reportForm" class="card">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Target Student</label>
                        <select id="student_select" class="form-input" required>
                            <option value="">-- Select Student --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Attendance Rate</label>
                        <input type="text" id="attendance" class="form-input" placeholder="e.g. 95%" required>
                    </div>
                </div>

                <div class="subjects-section">
                    <div class="subjects-header">
                        <h3 style="margin: 0;"><i class="fas fa-list-check"></i> Performance Modules</h3>
                        <button type="button" id="clearStatsBtn" class="btn-lite">
                            <i class="fas fa-undo"></i> Reset
                        </button>
                    </div>

                    <div id="subjectsContainer">
                        <!-- Subject rows injected by JS -->
                    </div>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Academic Remarks</label>
                    <textarea id="remarks" class="form-input" style="min-height: 100px; resize: vertical;"
                        placeholder="Enter student progress summary and feedback..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary"
                    style="width: 100%; margin-top: 30px; padding: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">
                    <span id="btnText">Generate PDF Report</span>
                    <div class="loading-spinner" id="btnSpinner"></div>
                </button>
            </form>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        const studentSelect = document.getElementById('student_select');
        const subjectsContainer = document.getElementById('subjectsContainer');
        const attendanceInput = document.getElementById('attendance');
        const token = localStorage.getItem('access_token');

        function initSubjectRows(data = []) {
            subjectsContainer.innerHTML = '';
            const rowCount = Math.max(data.length, 5);
            for (let i = 0; i < rowCount; i++) {
                const row = document.createElement('div');
                row.className = 'subject-grid';
                row.innerHTML = `
                    <div>
                        <input type="text" class="form-input subject-name" placeholder="Subject Title" value="${data[i]?.name || ''}">
                    </div>
                    <div>
                        <input type="text" class="form-input subject-marks" placeholder="Score" value="${data[i]?.marks || ''}" style="text-align: center;">
                    </div>
                `;
                subjectsContainer.appendChild(row);
            }
        }

        async function loadStudents() {
            try {
                const res = await fetch('/teacher/dashboard/students', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const students = await res.json();
                    studentSelect.innerHTML = '<option value="">-- Select Student --</option>';
                    students.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.student_id;
                        opt.textContent = `${s.name} [ROLL# ${s.roll_no}]`;
                        studentSelect.appendChild(opt);
                    });
                }
            } catch (err) { console.error(err); }
        }

        studentSelect.addEventListener('change', async () => {
            if (!studentSelect.value) return;

            try {
                const res = await fetch(`/students/${studentSelect.value}/report-stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const stats = await res.json();
                    attendanceInput.value = stats.attendance;
                    initSubjectRows(stats.subjects);
                }
            } catch (err) { console.error(err); }
        });

        document.getElementById('clearStatsBtn').onclick = () => {
            subjectsContainer.style.opacity = '0.5';
            setTimeout(() => {
                initSubjectRows();
                subjectsContainer.style.opacity = '1';
            }, 200);
        };

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const subjects = [];
            document.querySelectorAll('.subject-grid').forEach(row => {
                const name = row.querySelector('.subject-name').value;
                const marks = row.querySelector('.subject-marks').value;
                if (name && marks) subjects.push({ name, marks });
            });

            const data = {
                student_name: studentSelect.options[studentSelect.selectedIndex].text.split(' [')[0],
                attendance: attendanceInput.value,
                remarks: document.getElementById('remarks').value,
                subjects: subjects
            };

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const submitBtn = document.getElementById('submitBtn');

            try {
                btnText.textContent = 'Generating PDF...';
                btnSpinner.style.display = 'block';
                submitBtn.disabled = true;

                const response = await fetch('/reports/generate', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `REPORT_${data.student_name.toUpperCase()}.pdf`;
                    a.click();

                    // Success feedback
                    btnText.textContent = 'Report Generated!';
                    setTimeout(() => {
                        btnText.textContent = 'Generate PDF Report';
                    }, 2000);
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.detail || 'Failed to generate report'));
                }
            } catch (error) {
                console.error('Failure:', error);
                alert('An error occurred during report generation.');
            } finally {
                btnSpinner.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        loadStudents();
        initSubjectRows();
    </script>
</body>

</html>
