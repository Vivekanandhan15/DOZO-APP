<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - DOZO</title>
    <link rel="shortcut icon" href="/static/assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/todo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="/static/assets/logo.png" alt="DOZO Logo">
        </div>
        <div class="nav-center">
            <h2>Todo List</h2>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <i class="fa fa-search"></i>
                <input type="text" placeholder="Search tasks...">
            </div>
            <div class="user-profile">
                <span id="userName" style="font-size: 0.9rem; font-weight: 600;">Admin</span>
                <i class="fa fa-user-circle" style="font-size: 1.5rem; color: var(--primary-color);"></i>
            </div>
        </div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-section">
            <h3 class="sidebar-title">MAIN MENU</h3>
            <a href="/admin" class="menu-item"><i class="fa fa-chart-line"></i> Dashboard</a>
            <a href="/admin/tasks" class="menu-item"><i class="fa fa-tasks"></i> Tasks</a>
            <a href="/admin/task-review" class="menu-item"><i class="fa fa-check-double"></i> Task
                Review</a>
            <a href="/attendance" class="menu-item"><i class="fa fa-calendar-check"></i> Attendance</a>
            <a href="/admin/students" class="menu-item"><i class="fa fa-users"></i> Students</a>
            <a href="/admin/teachers" class="menu-item"><i class="fa fa-chalkboard-teacher"></i> Teachers</a>
            <a href="/admin/staff-management" class="menu-item"><i class="fa fa-user-shield"></i> Staff Management</a>
            <a href="/admin/batches" class="menu-item"><i class="fa fa-layer-group"></i> Batches</a>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">TOOLS</h3>
            <a href="/admin/todo" class="menu-item active"><i class="fa fa-list-ul"></i> Todo List</a>
            <a href="/admin/announcements" class="menu-item"><i class="fa fa-bullhorn"></i>
                Announcements</a>
            <a href="/admin/leave-approval" class="menu-item"><i class="fa fa-envelope-open-text"></i> Leave
                Approval</a>
            <a href="/admin/reports" class="menu-item"><i class="fa fa-file-pdf"></i> Reports</a>
        </div>
    </aside>

    <div class="main-wrapper">
        <div class="content-header">
            <div>
                <h1>Todo List</h1>
                <p>Manage your personal priorities and tasks</p>
            </div>
        </div>
        <!-- Add Todo Form -->
        <div class="add-todo-section">
            <h3>Add New Task</h3>
            <form id="addTodoForm">
                <div class="form-group">
                    <input type="text" id="todoTitle" placeholder="Task Title" required>
                </div>
                <div class="form-row">
                    <select id="todoPriority">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>
                    <input type="date" id="todoDueDate">
                    <button type="submit" class="btn-primary"><i class="fas fa-plus"></i> Add Task</button>
                </div>
            </form>
        </div>

        <!-- Todo List -->
        <div class="todo-list-section">
            <div class="filter-tabs">
                <button class="tab active" data-filter="all">All</button>
                <button class="tab" data-filter="Pending">Pending</button>
                <button class="tab" data-filter="Completed">Completed</button>
            </div>

            <div id="todoList" class="todo-items">
                <!-- Items will be injected here -->
            </div>
        </div>
    </div> <!-- Close todo-container -->
    </div> <!-- Close main-wrapper -->

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/todo.js"></script>
</body>

</html>
