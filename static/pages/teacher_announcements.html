<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Announcements | DOZO</title>
    <link rel="shortcut icon" href="/static/assets/logo.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="/static/assets/logo.png" alt="DOZO Logo">
        </div>
        <div class="nav-center">
            <h2>Announcements</h2>
        </div>
        <div class="nav-right">
            <div class="user-profile">
                <span class="welcome-title" style="font-size: 0.9rem; font-weight: 600;">Teacher</span>
                <i class="fa fa-user-circle" style="font-size: 1.5rem; color: var(--primary-color);"></i>
            </div>
        </div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-section">
            <h3 class="sidebar-title">MAIN MENU</h3>
            <a href="/teacher" class="menu-item"><i class="fa fa-chart-line"></i> Dashboard</a>
            <a href="/teacher/students" class="menu-item"><i class="fa fa-users"></i> My Students</a>
            <a href="/teacher/batches" class="menu-item"><i class="fa fa-layer-group"></i> My Batches</a>
            <a href="/teacher/attendance" class="menu-item"><i class="fa fa-calendar-check"></i> Attendance</a>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">TOOLS</h3>
            <a href="/teacher/announcements" class="menu-item active"><i class="fa fa-bullhorn"></i> Announcements</a>
            <a href="/teacher/reports" class="menu-item"><i class="fa fa-file-pdf"></i> Reports</a>
            <a href="/teacher/leaves" class="menu-item"><i class="fa fa-envelope-open-text"></i> Leave Requests</a>
            <a href="/teacher/change-password" class="menu-item"><i class="fa fa-key"></i> Change Password</a>
        </div>
        <div class="sidebar-footer">
            <a href="#" onclick="logout(); return false;" class="menu-item logout"><i class="fas fa-sign-out-alt"></i>
                Logout</a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header style="margin-bottom: 24px;">
            <div>
                <h1>Announcements</h1>
                <p>Post updates to your classes</p>
            </div>
        </header>

        <div class="content-wrapper">
            <div class="card" style="margin-bottom:20px;">
                <h3>Post New Announcement</h3>
                <form id="announcementForm" style="margin-top:15px;">
                    <div style="margin-bottom:15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">Title</label>
                        <input type="text" id="title" required
                            style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px;">
                    </div>
                    <div style="margin-bottom:15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">Content</label>
                        <textarea id="content" required rows="4"
                            style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px;"></textarea>
                    </div>
                    <div style="margin-bottom:15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold;">Target Batch</label>
                        <select id="batchSelect"
                            style="width:100%; padding:10px; border:1px solid #ddd; border-radius:5px;">
                            <option value="">All My Batches</option>
                        </select>
                    </div>
                    <div style="text-align:right;">
                        <button type="submit"
                            style="padding:10px 25px; background:#4f46e5; color:white; border:none; border-radius:5px; cursor:pointer;">Post
                            Announcement</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h3>Recent Announcements</h3>
                <div id="announcementsList">
                    <p style="text-align:center; padding:20px;">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/teacher_announcements.js"></script>
</body>

</html>
