<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance | DOZO</title>
    <link rel="shortcut icon" href="/static/assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/student_page.css"> <!-- Reusing calendar styles -->
</head>

<body>
    <nav class="navbar">
        <div class="nav-left"><img src="/static/assets/logo.png" alt="DOZO"></div>
        <div class="nav-center">
            <h2>My Attendance History</h2>
        </div>
        <div class="nav-right">
            <span id="teacher-name-nav" style="font-weight: 600;">Teacher</span>
            <i class="fa fa-user-circle" style="font-size: 1.5rem; color: var(--primary-color);"></i>
        </div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">Manage</div>
            <a href="/teacher" class="menu-item"><i class="fas fa-home"></i> Dashboard</a>
            <a href="/teacher/attendance" class="menu-item active"><i class="fas fa-calendar-check"></i> My
                Attendance</a>
            <a href="/teacher/leaves" class="menu-item"><i class="fas fa-envelope-open-text"></i> My Leaves</a>
            <a href="/teacher/change-password" class="menu-item"><i class="fa fa-key"></i> Change Password</a>
        </div>
        <div class="sidebar-footer">
            <a href="#" onclick="logout(); return false;" class="menu-item logout"><i class="fas fa-sign-out-alt"></i>
                Logout</a>
        </div>
    </aside>

    <div class="main-wrapper">
        <div class="attendance-section" style="max-width: 800px; margin: 0 auto;">
            <div class="attendance-header">
                <h2 id="monthYear">Month Year</h2>
                <div class="calendar-nav" style="margin-top: 15px;">
                    <button id="prevMonth"><i class="fas fa-chevron-left"></i></button>
                    <button id="nextMonth"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="calendar" style="margin-top: 20px;">
                <div class="day-name">Sun</div>
                <div class="day-name">Mon</div>
                <div class="day-name">Tue</div>
                <div class="day-name">Wed</div>
                <div class="day-name">Thu</div>
                <div class="day-name">Fri</div>
                <div class="day-name">Sat</div>
            </div>
            <div id="calendarDays" class="calendar-days"></div>

            <div class="calendar-legend" style="margin-top: 30px;">
                <div class="legend-item"><span class="legend present"></span> Present</div>
                <div class="legend-item"><span class="legend absent"></span> Absent</div>
                <div class="legend-item"><span class="legend today"></span> Today</div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/teacher_attendance.js"></script>
</body>

</html>
