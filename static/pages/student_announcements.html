<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | DOZO</title>
    <link rel="shortcut icon" href="/static/assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/student_page.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <img src="/static/assets/logo.png" alt="DOZO Logo">
        </div>
        <div class="nav-center">
            <h2>Announcements</h2>
        </div>
        <div class="nav-right">
            <div class="user-profile">
                <span id="student-name-nav" style="font-size: 0.9rem; font-weight: 600;">Student</span>
                <i class="fa fa-user-circle" style="font-size: 1.5rem; color: var(--primary-color);"></i>
            </div>
        </div>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-section">
            <h3 class="sidebar-title">MAIN MENU</h3>
            <a href="/student" class="menu-item"><i class="fa fa-chart-line"></i> Dashboard</a>
            <a href="/student/tasks" class="menu-item"><i class="fa fa-tasks"></i> My Tasks</a>
            <a href="/student/attendance" class="menu-item"><i class="fa fa-calendar-check"></i> My Attendance</a>
            <a href="/student/leaves" class="menu-item"><i class="fa fa-envelope-open-text"></i> Leave Requests</a>
        </div>
        <div class="sidebar-section">
            <h3 class="sidebar-title">SYSTEM</h3>
            <a href="/student/announcements" class="menu-item active"><i class="fa fa-bullhorn"></i> Announcements</a>
            <a href="/student/profile" class="menu-item"><i class="fa fa-user"></i> My Profile</a>
        </div>
        <div class="sidebar-footer">
            <a href="#" onclick="logout(); return false;" class="menu-item logout"><i class="fas fa-sign-out-alt"></i>
                Logout</a>
        </div>
    </aside>

    <div class="main-wrapper">
        <section class="announcements-section" style="padding: 20px;">
            <div class="announcements-header">
                <h2>Recent Announcements</h2>
                <p>Stay updated with the latest news and notices</p>
            </div>
            <div id="announcementsList" class="announcements-list"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
                <!-- Announcements will be loaded here -->
            </div>
        </section>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/student_announcements.js"></script>
</body>

</html>
